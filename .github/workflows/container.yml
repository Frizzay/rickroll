name: Container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Rebuild and rescan weekly: new CVEs and Alpine updates appear
    # without code changes too.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  build-scan-push:
    name: Build, scan with Trivy, push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # to push to ghcr.io
    steps:
      # Actions are pinned to commit SHAs because tags can be moved
      # (as happened to trivy-action in March 2026).
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Image names on GHCR must be lowercase.
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE:$GITHUB_SHA" \
            --tag "$IMAGE:latest" \
            .

      - name: Scan image for CVEs with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          version: v0.76.2
          severity: HIGH,CRITICAL
          # Fail the build as soon as a HIGH or CRITICAL vulnerability is found
          exit-code: "1"
          format: table

      # Only push from main, and only if Trivy found nothing.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
